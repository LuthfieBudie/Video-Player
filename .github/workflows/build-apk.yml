name: Build APK

on:
  workflow_dispatch:          # tombol "Run workflow" di tab Actions
  push:
    branches: [main, master]  # otomatis setiap kali ada perubahan di-push

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Android SDK sudah terpasang di server GitHub (ubuntu-latest), tinggal dicek
      - name: Cek Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - name: Install Capacitor
        run: npm install

      # simpan komponen Gradle/Android supaya build berikutnya tidak perlu mengunduh ulang dari Maven
      # (mengurangi error "429 Too Many Requests")
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Siapkan file website (www/)
        run: node build-www.js

      - name: Buat project Android
        run: npx cap add android

      - name: Pasang ikon & splash
        run: |
          python -m pip install pillow
          python make-android-icons.py android/app/src/main/res

      - name: Sinkron
        run: npx cap sync android

      - name: Nomor versi otomatis
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Kunci tanda tangan yang SAMA setiap build -> APK baru bisa dipasang di atas versi lama
      # tanpa uninstall, jadi playlist, favorit, API key & folder tidak hilang.
      - name: Pakai kunci tanda tangan tetap
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Kunci tanda tangan tetap dipakai."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diisi. APK memakai kunci acak, jadi update harus uninstall dulu dan data hilang."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          # coba sampai 3x: kalau server Maven sedang sibuk (429), tunggu 1 menit lalu ulangi
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Build gagal (percobaan $i). Menunggu 60 detik lalu mencoba lagi..."
            sleep 60
          done
          [ "$ok" = 1 ]

      - name: Ambil APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VideoGallery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGallery-apk
          path: VideoGallery.apk

      - name: Terbitkan di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Video Gallery APK
          body: "APK terbaru dari commit ${{ github.sha }}. Download VideoGallery.apk lalu install di HP Android."
          files: VideoGallery.apk
          make_latest: true