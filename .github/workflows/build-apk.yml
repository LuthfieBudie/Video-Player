name: Build APK

on:
  workflow_dispatch:          # tombol "Run workflow" di tab Actions
  push:
    branches: [main, master]  # otomatis setiap kali ada perubahan di-push

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Siapkan file website (www/)
        run: node build-www.js

      - name: Buat project Android
        run: npx cap add android

      - name: Pasang ikon & splash
        run: |
          pip install pillow
          python make-android-icons.py android/app/src/main/res

      - name: Sinkron
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ambil APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VideoGallery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGallery-apk
          path: VideoGallery.apk

      - name: Terbitkan di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Video Gallery APK
          body: "APK terbaru dari commit ${{ github.sha }}. Download VideoGallery.apk lalu install di HP Android."
          files: VideoGallery.apk
          make_latest: true
